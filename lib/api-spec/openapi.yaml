openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FinTech Platform API - Loans & Credit Cards
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: applications
    description: Loan & credit card applications
  - name: vendors
    description: Vendor/channel partner management
  - name: commissions
    description: Commission tracking
  - name: documents
    description: Document management
  - name: notifications
    description: Notifications
  - name: communications
    description: Recovery & communications
  - name: analytics
    description: Analytics & dashboard data
  - name: leads
    description: Lead management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registration success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, vendor, employee, customer]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

    post:
      operationId: createUser
      tags: [users]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # APPLICATIONS
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List loan/card applications
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, under_review, approved, rejected, disbursed, cancelled]
        - in: query
          name: type
          schema:
            type: string
            enum: [personal_loan, student_loan, gold_loan, unsecured_loan, business_loan, credit_card]
        - in: query
          name: vendorId
          schema:
            type: integer
        - in: query
          name: customerId
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Applications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"

    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit a new loan/card application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationBody"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{applicationId}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application details
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update application (admin/vendor)
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationBody"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{applicationId}/status:
    put:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  # VENDORS
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List all vendors/channel partners
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, suspended]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Vendors list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorListResponse"

    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a vendor/channel partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorBody"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{vendorId}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor by ID
      parameters:
        - in: path
          name: vendorId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

    put:
      operationId: updateVendor
      tags: [vendors]
      summary: Update vendor
      parameters:
        - in: path
          name: vendorId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorBody"
      responses:
        "200":
          description: Vendor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{vendorId}/team:
    get:
      operationId: getVendorTeam
      tags: [vendors]
      summary: Get vendor team members
      parameters:
        - in: path
          name: vendorId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required:
                  - members

  /vendors/leaderboard:
    get:
      operationId: getVendorLeaderboard
      tags: [vendors]
      summary: Get top performing vendors
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, quarter, year]
            default: month
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Vendor leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  # COMMISSIONS
  /commissions:
    get:
      operationId: listCommissions
      tags: [commissions]
      summary: List commission records
      parameters:
        - in: query
          name: vendorId
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, paid, cancelled]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Commissions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionListResponse"

  /commissions/summary:
    get:
      operationId: getCommissionSummary
      tags: [commissions]
      summary: Get commission summary for a vendor
      parameters:
        - in: query
          name: vendorId
          schema:
            type: integer
      responses:
        "200":
          description: Commission summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionSummary"

  # DOCUMENTS
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      parameters:
        - in: query
          name: applicationId
          schema:
            type: integer
        - in: query
          name: userId
          schema:
            type: integer
      responses:
        "200":
          description: Documents list
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"
                required:
                  - documents

    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocumentBody"
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{documentId}/verify:
    put:
      operationId: verifyDocument
      tags: [documents]
      summary: Verify or reject a document (admin/KYC)
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyDocumentBody"
      responses:
        "200":
          description: Document verification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  # LEADS
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      parameters:
        - in: query
          name: assignedTo
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [new, contacted, qualified, converted, lost]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Leads list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadListResponse"

    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{leadId}/assign:
    put:
      operationId: assignLead
      tags: [leads]
      summary: Assign lead to vendor/employee
      parameters:
        - in: path
          name: leadId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLeadBody"
      responses:
        "200":
          description: Lead assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  # COMMUNICATIONS
  /communications:
    get:
      operationId: listCommunications
      tags: [communications]
      summary: List communication logs
      parameters:
        - in: query
          name: customerId
          schema:
            type: integer
        - in: query
          name: type
          schema:
            type: string
            enum: [sms, email, whatsapp, call]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Communications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunicationListResponse"

    post:
      operationId: sendCommunication
      tags: [communications]
      summary: Send a communication (SMS, email, WhatsApp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCommunicationBody"
      responses:
        "201":
          description: Communication sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Communication"

  /communications/campaigns:
    get:
      operationId: listCampaigns
      tags: [communications]
      summary: List recovery campaigns
      responses:
        "200":
          description: Campaigns list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignListResponse"

    post:
      operationId: createCampaign
      tags: [communications]
      summary: Create a communication campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      parameters:
        - in: query
          name: read
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{notificationId}/read:
    put:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ANALYTICS
  /analytics/dashboard:
    get:
      operationId: getDashboardAnalytics
      tags: [analytics]
      summary: Get admin dashboard analytics summary
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [today, week, month, quarter, year]
            default: month
      responses:
        "200":
          description: Dashboard analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalytics"

  /analytics/applications:
    get:
      operationId: getApplicationAnalytics
      tags: [analytics]
      summary: Get application analytics breakdown
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [today, week, month, quarter, year]
            default: month
      responses:
        "200":
          description: Application analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationAnalytics"

  /analytics/vendors:
    get:
      operationId: getVendorAnalytics
      tags: [analytics]
      summary: Get vendor performance analytics
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [today, week, month, quarter, year]
            default: month
        - in: query
          name: vendorId
          schema:
            type: integer
      responses:
        "200":
          description: Vendor analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAnalytics"

  /analytics/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [analytics]
      summary: Get recent activity feed
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentActivityResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    # AUTH SCHEMAS
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
        phone:
          type: string
      required:
        - email
        - password
        - name

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    # USER SCHEMAS
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, vendor, employee, customer]
        status:
          type: string
          enum: [active, inactive, suspended]
        vendorId:
          type: integer
          nullable: true
        avatar:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - status
        - createdAt

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - users
        - total
        - page
        - limit

    CreateUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, vendor, employee, customer]
        vendorId:
          type: integer
        password:
          type: string
      required:
        - email
        - name
        - role
        - password

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, vendor, employee, customer]
        status:
          type: string
          enum: [active, inactive, suspended]
        vendorId:
          type: integer

    # APPLICATION SCHEMAS
    Application:
      type: object
      properties:
        id:
          type: integer
        applicationNumber:
          type: string
        type:
          type: string
          enum: [personal_loan, student_loan, gold_loan, unsecured_loan, business_loan, credit_card]
        status:
          type: string
          enum: [pending, under_review, approved, rejected, disbursed, cancelled]
        customerId:
          type: integer
        vendorId:
          type: integer
          nullable: true
        amount:
          type: number
          nullable: true
        tenure:
          type: integer
          nullable: true
        interestRate:
          type: number
          nullable: true
        purpose:
          type: string
          nullable: true
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        panNumber:
          type: string
          nullable: true
        aadhaarNumber:
          type: string
          nullable: true
        monthlyIncome:
          type: number
          nullable: true
        employmentType:
          type: string
          nullable: true
        bankName:
          type: string
          nullable: true
        remarks:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - applicationNumber
        - type
        - status
        - customerId
        - customerName
        - customerEmail
        - customerPhone
        - createdAt
        - updatedAt

    ApplicationListResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - applications
        - total
        - page
        - limit

    CreateApplicationBody:
      type: object
      properties:
        type:
          type: string
          enum: [personal_loan, student_loan, gold_loan, unsecured_loan, business_loan, credit_card]
        amount:
          type: number
        tenure:
          type: integer
        purpose:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        customerPhone:
          type: string
        panNumber:
          type: string
        aadhaarNumber:
          type: string
        monthlyIncome:
          type: number
        employmentType:
          type: string
        bankName:
          type: string
        vendorId:
          type: integer
      required:
        - type
        - customerName
        - customerEmail
        - customerPhone

    UpdateApplicationBody:
      type: object
      properties:
        amount:
          type: number
        tenure:
          type: integer
        interestRate:
          type: number
        purpose:
          type: string
        remarks:
          type: string
